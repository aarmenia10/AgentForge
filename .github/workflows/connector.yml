name: Connector

# Deploys the remote connector (README section 7.6) to Cloudflare Workers.
on:
  push:
    branches: [main]
    paths:
      - 'packages/connector/**'
      - 'packages/mcp-server/src/**'
      - 'src/lib/manifestSchema.ts'
      - 'src/types/**'
      - 'public/catalog.json'
      - '.github/workflows/connector.yml'
  workflow_dispatch:

concurrency:
  group: connector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONNECTOR_ORIGIN: https://agentforge-connector.lesslimit.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Shared modules resolve their imports from the repository root.
      - run: npm ci

      - name: Install connector dependencies
        working-directory: packages/connector
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: packages/connector
        run: npm run check

      - name: Test
        run: npx tsx --test tests/connector.test.ts

      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set. Skipping deploy."
          fi

      - name: Deploy
        if: steps.creds.outputs.present == 'true'
        working-directory: packages/connector
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke-test the live connector
        if: steps.creds.outputs.present == 'true'
        working-directory: packages/connector
        run: node smoke.mjs "$CONNECTOR_ORIGIN"
