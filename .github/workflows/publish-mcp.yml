name: Publish MCP package

# Manual only. Publishes packages/mcp-server to npm as agentforge-registry.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check
        run: |
          npm run lint
          npm run format:check
          npm run build
          npm test
          npm run test:package
        env:
          AGENTFORGE_CATALOG_SOURCE: seed

      # Refuse to run if this exact version is already on npm.
      - name: Confirm the version is unpublished
        working-directory: packages/mcp-server
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [ "$NAME" != "agentforge-registry" ]; then
            echo "::error::Unexpected package name: $NAME"; exit 1
          fi
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published. Bump the version first."; exit 1
          fi
          echo "Publishing $NAME@$VERSION"

      - name: Require the npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN repository secret is not set."; exit 1
          fi
          npm whoami

      - name: Publish
        working-directory: packages/mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Verify
        working-directory: ${{ runner.temp }}
        run: |
          sleep 20
          npm view agentforge-registry version dist.tarball
          npx -y agentforge-registry@latest --help
