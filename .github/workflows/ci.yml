name: CI

on:
  push:
    branches: [main, 'task/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: ci-${{ github.ref }}
  # An hourly run waits for a deploy already in flight. If it cancelled one, it
  # would then skip its own deploy (catalog unchanged) and the push would be lost.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT: agentforge-b10db
      AGENTLEMON_CATALOG_SOURCE: seed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # The catalog is built from the seed file here. Credentials are not
      # present yet, so the exporter cannot reach Firestore by accident.
      - name: Build
        run: npm run build
        env:
          AGENTLEMON_CATALOG_SOURCE: seed

      - name: Test
        run: npm test

      - name: Check standalone package and committed tarball
        run: npm run test:package

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test Firestore rules and transactions
        run: npm run test:firestore

      # Deploy only from main, and only once the owner has added the secret.
      - name: Check for deploy credentials
        id: creds
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CATALOG_SOURCE: ${{ vars.CATALOG_SOURCE }}
        run: |
          if [ -n "$SA" ]; then
            printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$CATALOG_SOURCE" = "firestore" ]; then
              echo "::error::Firestore catalog export requires FIREBASE_SERVICE_ACCOUNT."
              exit 1
            fi
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set. Skipping deploy."
          fi

      # Seed/package tests above cannot see production data. A failed Firestore
      # export stops this job before Hosting can replace the last good snapshot.
      - name: Read deployed export state
        if: steps.creds.outputs.present == 'true' && github.event_name == 'schedule'
        run: |
          status=$(curl --silent --show-error --retry 3 -w '%{http_code}' "https://$FIREBASE_PROJECT.web.app/export-state.json?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -o "$RUNNER_TEMP/live-export-state.json")
          case "$status" in
            200|404) ;;
            *) echo "::error::Hosting returned HTTP $status"; exit 1 ;;
          esac

      - name: Restore public export checkpoint
        if: steps.creds.outputs.present == 'true' && vars.CATALOG_SOURCE == 'firestore' && github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/catalog-checkpoint.gpg
          key: export-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: export-v1-${{ github.sha }}-

      # Fork PRs can restore main's Actions caches. Keep withdrawn manifests
      # out of those readers' reach, even in an older cache. Key rotation or
      # cache damage simply causes a full rebuild.
      - name: Open export checkpoint
        if: steps.creds.outputs.present == 'true' && vars.CATALOG_SOURCE == 'firestore' && github.event_name == 'schedule'
        working-directory: ${{ runner.temp }}
        run: |
          if test -f catalog-checkpoint.gpg && sha256sum < sa.json | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --output checkpoint.tmp --decrypt catalog-checkpoint.gpg; then
            mv checkpoint.tmp catalog-checkpoint.json
          fi

      - name: Rebuild catalog and site from approved Firestore agents
        if: steps.creds.outputs.present == 'true' && vars.CATALOG_SOURCE == 'firestore'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GOOGLE_CLOUD_PROJECT: ${{ env.FIREBASE_PROJECT }}
          AGENTLEMON_CATALOG_SOURCE: firestore
          CATALOG_CHECKPOINT: ${{ github.event_name == 'schedule' && format('{0}/catalog-checkpoint.json', runner.temp) || '' }}
          CATALOG_LIVE_STATE: ${{ runner.temp }}/live-export-state.json
          CATALOG_RECEIPTS: ${{ runner.temp }}/export-receipts.json
        run: npm run build

      - name: Compare scheduled catalog and versions with live export
        id: catalog
        if: steps.creds.outputs.present == 'true' && github.event_name == 'schedule'
        run: |
          if cmp -s public/export-state.json "$RUNNER_TEMP/live-export-state.json"; then
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Hosting and Firestore rules
        if: steps.creds.outputs.present == 'true' && steps.catalog.outputs.unchanged != 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx firebase deploy --only hosting,firestore:rules --project "$FIREBASE_PROJECT" --non-interactive

      # Indexes need the "Cloud Datastore Index Admin" role on the deploy
      # service account. Until the owner grants it, this step warns and the
      # rest of the deploy still counts as successful.
      - name: Deploy Firestore indexes
        if: steps.creds.outputs.present == 'true' && steps.catalog.outputs.unchanged != 'true'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npx firebase deploy --only firestore:indexes --project "$FIREBASE_PROJECT" --non-interactive \
            || { echo "::warning::Firestore indexes were not deployed. Grant the deploy service account the Cloud Datastore Index Admin role."; exit 1; }

      # Only acknowledge the exact marker revisions seen by this export, after
      # Hosting succeeded or the complete live digest compared equal.
      - name: Acknowledge published export changes
        if: steps.creds.outputs.present == 'true' && vars.CATALOG_SOURCE == 'firestore'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GOOGLE_CLOUD_PROJECT: ${{ env.FIREBASE_PROJECT }}
          AGENTLEMON_CATALOG_SOURCE: firestore
          CATALOG_RECEIPTS: ${{ runner.temp }}/export-receipts.json
        run: npm run build:catalog -- --acknowledge

      - name: Encrypt published export checkpoint
        if: steps.creds.outputs.present == 'true' && vars.CATALOG_SOURCE == 'firestore' && github.event_name == 'schedule'
        working-directory: ${{ runner.temp }}
        run: sha256sum < sa.json | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --cipher-algo AES256 --output catalog-checkpoint.gpg --symmetric catalog-checkpoint.json

      - name: Save published export checkpoint
        if: steps.creds.outputs.present == 'true' && vars.CATALOG_SOURCE == 'firestore' && github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/catalog-checkpoint.gpg
          key: export-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
