<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover, download, and share AI tools that help you complete everyday tasks, save time, and work smarter. No coding or AI expertise required." />
    <title>AgentLemon · Achieve More.</title>
    <script>
      // The site moved to agentlemon.web.app (P3-0). The old address keeps
      // serving catalog.json, version files, and MCP tarballs for existing
      // installs; only page visits are sent on.
      ;(function () {
        var h = location.hostname
        if (h === 'agentforge-b10db.web.app' || h === 'agentforge-b10db.firebaseapp.com')
          location.replace('https://agentlemon.web.app' + location.pathname + location.search + location.hash)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the chosen colors before first paint to avoid a flash. The app
      // saves its computed CSS variables under agentlemon.appearance.cache
      // (src/theme/appearance.ts), so this script holds no color logic. With
      // nothing saved it applies the defaults (dark, black, lemon), which the
      // build inserts from the same module.
      ;(function () {
        var defaults = /*__APPEARANCE_DEFAULTS__*/ null
        var root = document.documentElement
        function apply(dark, tokens) {
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          for (var name in tokens) root.style.setProperty(name, tokens[name])
        }
        try {
          var mode = localStorage.getItem('agentlemon:theme')
          if (mode !== 'light' && mode !== 'dark') mode = 'dark'
          var cache = JSON.parse(localStorage.getItem('agentlemon.appearance.cache') || 'null')
          if (cache && cache.mode === mode && cache.tokens) return apply(cache.dark, cache.tokens)
          if (defaults) return apply(defaults[mode].dark, defaults[mode].tokens)
          apply(mode === 'dark', {})
        } catch (_) {
          if (defaults) apply(true, defaults.dark.tokens)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
