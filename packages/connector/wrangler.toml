# AgentLemon remote connector (README section 7.6).
# Free plan only. Do not add Durable Objects, KV, D1, R2, Queues, or any
# binding here: the connector is stateless by decision and must cost nothing.
name = "agentlemon-connector"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# Hourly export trigger (README section 7.6). Plain variable, not a binding.
# The secret GITHUB_DISPATCH_TOKEN is set by the owner in Cloudflare, never here.
[vars]
GITHUB_REPO = "aarmenia10/AgentForge"

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = false
